version: 2

project_name: tmuxai

before:
  hooks:
    - go mod download
    - go generate ./...

env:
  - CGO_ENABLED=0

builds:
  - id: windows
    goos:
      - windows
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/alvinunreal/tmuxai/internal.Version=v{{.Version}}
      - -s -w -X github.com/alvinunreal/tmuxai/internal.Commit={{.Commit}}
      - -s -w -X github.com/alvinunreal/tmuxai/internal.Date={{.Date}}

archives:
  - id: windows
    formats:
      - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "checksums.sha256"

snapshot:
  name_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^tasks:"
